<head>

<title>Terminal+ — Développement Personnel & Études</title>
<style>
:root{--bg:#05070f;--bg2:rgba(255,255,255,.05);--card:rgba(255,255,255,.07);--card2:rgba(255,255,255,.11);--txt:#f5f7ff;--muted:rgba(235,240,255,.58);--accent:#0a84ff;--accent2:#bf5af2;--green:#30d158;--red:#ff453a;--gold:#ffd60a;--border:rgba(255,255,255,.12);--radius:24px;--shine:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.03);--drop:0 12px 32px rgba(0,0,0,.3);--glass:blur(28px) saturate(180%)}
body.light{--bg:#eef1f8;--bg2:rgba(255,255,255,.5);--card:rgba(255,255,255,.62);--card2:rgba(255,255,255,.92);--txt:#0b1020;--muted:rgba(20,28,55,.55);--border:rgba(20,30,70,.09);--shine:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(255,255,255,.4);--drop:0 10px 28px rgba(40,60,120,.12)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:-apple-system,"SF Pro Display","SF Pro Text",Inter,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;background:radial-gradient(45% 35% at 12% 8%,rgba(10,132,255,.5),transparent 65%),radial-gradient(40% 35% at 92% 18%,rgba(191,90,242,.4),transparent 65%),radial-gradient(50% 40% at 75% 92%,rgba(48,209,88,.22),transparent 65%),radial-gradient(40% 30% at 5% 85%,rgba(255,159,10,.14),transparent 65%)}
body.light::before{opacity:.5}
.glass,.card,.daycol,.sidebar,.bottomnav,.modal,.toast{backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
.app{display:flex;min-height:100vh}
.sidebar{width:236px;position:fixed;top:12px;bottom:12px;left:12px;padding:16px 10px;display:flex;flex-direction:column;gap:3px;z-index:50;border-radius:28px;background:var(--card);border:1px solid var(--border);box-shadow:var(--shine),var(--drop);overflow-y:auto}
.logo{font-size:1.2rem;font-weight:800;padding:6px 12px 16px;letter-spacing:-.03em;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.navbtn{display:flex;align-items:center;gap:11px;padding:10px 13px;border:none;background:transparent;color:var(--muted);border-radius:16px;cursor:pointer;font-size:.9rem;font-weight:600;font-family:inherit;width:100%;text-align:left;transition:.2s}
.navbtn:hover{background:var(--bg2);color:var(--txt)}
.navbtn.active{background:var(--card2);color:var(--txt);box-shadow:var(--shine),0 2px 10px rgba(0,0,0,.15)}
.navbtn .ico{width:22px;text-align:center}
.main{flex:1;min-width:0;margin-left:260px;padding:32px 30px 90px;max-width:1250px}
.view{display:none}.view.active{display:block}
.main>*{animation:fade .4s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1}}
h1{font-size:2.1rem;font-weight:800;letter-spacing:-.035em;margin-bottom:2px}
.sub{color:var(--muted);font-size:.95rem;margin-bottom:22px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shine),var(--drop)}
.card h3{font-size:.95rem;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.stat{font-size:2rem;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.statlbl{color:var(--muted);font-size:.8rem;font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border:1px solid var(--border);border-radius:999px;font-weight:700;font-size:.9rem;font-family:inherit;cursor:pointer;transition:.18s;background:var(--card2);color:var(--txt);box-shadow:var(--shine)}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:rgba(255,255,255,.25);box-shadow:var(--shine),0 6px 20px rgba(10,132,255,.4)}
.btn.green{background:var(--green);color:#03210b;border-color:transparent}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none}
.btn.small{padding:7px 14px;font-size:.8rem}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.days{display:flex;gap:14px;overflow-x:auto;padding-bottom:14px;scroll-snap-type:x mandatory;scrollbar-width:none}
.daycol{min-width:236px;flex:1;scroll-snap-align:center;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:10px;box-shadow:var(--shine),var(--drop)}
.daycol.today{border-color:rgba(10,132,255,.6);box-shadow:var(--shine),0 0 0 1px rgba(10,132,255,.3),0 0 40px rgba(10,132,255,.2)}
.daycol h4{text-align:center;padding:8px 0 12px;font-size:.9rem;font-weight:700}
.slot{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:.2s;box-shadow:var(--shine);font-size:.85rem}
.slot:hover{background:var(--card2)}.slot:active{transform:scale(.98)}
.slot .t{color:var(--muted);font-size:.72rem;font-weight:700;font-variant-numeric:tabular-nums}
.slot .n{font-weight:700;margin:3px 0 5px}
.slot.done{opacity:.6;border-color:rgba(48,209,88,.5)}
.slot.done .t{color:var(--green)}
.slot .badge{font-size:.65rem;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--muted);font-weight:700}
.pdhead{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.pdicon{width:58px;height:58px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;background:var(--card2);box-shadow:var(--shine)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}
.chip{background:var(--card2);border:1px solid var(--border);border-radius:999px;padding:5px 13px;font-size:.78rem;font-weight:600;color:var(--muted)}
.chip.xp{background:rgba(48,209,88,.14);color:var(--green);border-color:rgba(48,209,88,.3)}
.resrow{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--border);border-radius:18px;margin-bottom:9px;background:var(--bg2);box-shadow:var(--shine)}
.resrow .ric{width:42px;height:42px;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:1.15rem;flex-shrink:0}
.resrow .rt{flex:1;min-width:0}.resrow .rt b{font-size:.9rem}.resrow .rt p{color:var(--muted);font-size:.76rem}
.resrow a{color:var(--accent);font-size:.78rem;font-weight:700;text-decoration:none}
.tip{border-left:3px solid var(--gold);background:rgba(255,214,10,.08);padding:11px 14px;border-radius:0 16px 16px 0;margin-bottom:8px;font-size:.85rem}
.xpbar{height:8px;background:var(--card2);border-radius:999px;overflow:hidden;margin:10px 0 6px}
.xpbar>div{height:100%;background:linear-gradient(90deg,var(--green),var(--accent));border-radius:999px;box-shadow:0 0 12px rgba(10,132,255,.6);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.habit{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:18px;margin-bottom:9px;box-shadow:var(--shine)}
.habit .cb{width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.85rem;color:transparent;flex-shrink:0;transition:.2s}
.habit .cb.on{background:var(--green);border-color:var(--green);color:#03210b}
.habit b{flex:1;font-size:.9rem}.habit .meta{color:var(--muted);font-size:.74rem}
.habit.done b{color:var(--muted);text-decoration:line-through}
.jq{font-weight:700;font-size:.9rem;margin:14px 0 6px}
textarea,input[type=text],input[type=time],input[type=date],input[type=number],select{width:100%;background:var(--bg2);border:1px solid var(--border);color:var(--txt);border-radius:16px;padding:11px 14px;font-size:.9rem;font-family:inherit;outline:none;box-shadow:var(--shine)}
textarea:focus,input:focus{border-color:var(--accent)}
textarea{min-height:64px;resize:vertical}
.timerbig{font-size:3.6rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.05em;margin:14px 0}
.timerbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.segdisp{display:flex;gap:6px;justify-content:center;margin-bottom:8px;padding:4px;background:var(--bg2);border-radius:999px;width:fit-content;margin-inline:auto}
.seg{padding:6px 16px;border-radius:999px;border:none;background:transparent;color:var(--muted);font-weight:700;cursor:pointer;font-size:.82rem;transition:.2s}
.seg.on{background:var(--card2);color:var(--txt);box-shadow:var(--shine),0 2px 8px rgba(0,0,0,.2)}
.bottomnav{display:none;position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:60;overflow-x:auto;padding:6px;border-radius:32px;background:var(--card);border:1px solid var(--border);box-shadow:var(--shine),0 14px 40px rgba(0,0,0,.4);scrollbar-width:none}
.bottomnav .row{display:flex;min-width:max-content;gap:2px}
.bnavbtn{flex:1;min-width:76px;border:none;background:transparent;color:var(--muted);font-size:.62rem;font-weight:700;font-family:inherit;padding:8px 6px;cursor:pointer;text-align:center;border-radius:24px;white-space:nowrap;transition:.2s}
.bnavbtn .ico{display:block;font-size:1.2rem;margin-bottom:2px}
.bnavbtn.active{color:var(--accent);background:var(--card2);box-shadow:var(--shine)}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:100;padding:18px}
.modalbg.show{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:32px;padding:28px;max-width:420px;width:100%;text-align:center;box-shadow:var(--shine),0 24px 60px rgba(0,0,0,.5);animation:fade .3s}
.modal .big{font-size:3rem;margin-bottom:6px}
.lrow{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border-bottom:1px solid var(--border);font-size:.87rem}
.lrow:last-child{border-bottom:none}
.pill{font-size:.7rem;font-weight:800;padding:3px 10px;border-radius:999px}
.subjhdr{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;background:var(--card);border:1px solid var(--border);border-radius:20px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shine)}
.subjhdr b{font-size:.95rem}
.subjbody{display:none;padding:4px 6px 12px}.subj.open .subjbody{display:block}
.chap{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;background:var(--bg2);border-radius:14px;margin-bottom:6px;font-size:.85rem}
.switch{position:relative;width:48px;height:28px;background:var(--card2);border:1px solid var(--border);border-radius:999px;cursor:pointer;transition:.25s;flex-shrink:0}
.switch.on{background:var(--green)}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:.25s}
.switch.on::after{left:22px}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(48,209,88,.85);color:#03210b;font-weight:800;padding:11px 22px;border-radius:999px;opacity:0;transition:.3s;z-index:200;pointer-events:none;font-size:.9rem;box-shadow:0 10px 30px rgba(48,209,88,.35)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:861px){.sidebar{display:flex}}
@media(max-width:860px){
  .sidebar{display:none}
  .main{margin-left:0;padding:calc(22px + env(safe-area-inset-top)) 16px 130px}
  .bottomnav{display:block}
  h1{font-size:1.9rem}
  .g4{grid-template-columns:1fr 1fr}
  .g4>.card:nth-child(2){order:-1;grid-column:1/-1}
  .g4>.card:nth-child(4){grid-column:1/-1}
  .g4 .stat{font-size:1.7rem}
  .daycol{min-width:86%;flex:0 0 86%}
}
::-webkit-scrollbar{height:0;width:0}

.bottomnav .row{display:flex;width:100%;min-width:0;gap:2px}
.bnavbtn{min-width:0;padding:8px 2px;font-size:.66rem}
.bnavbtn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto 3px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.brand svg{width:50px;height:50px;flex-shrink:0}
.bt{font-size:1.55rem;font-weight:800;letter-spacing:-.03em}.bt span{color:var(--accent)}
.bs{color:var(--muted);font-size:.82rem}
.lvbadge{margin-left:auto;background:var(--card2);border:1px solid var(--border);border-radius:999px;padding:7px 14px;font-weight:800;font-size:.85rem;color:var(--gold);box-shadow:var(--shine)}
.hello{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.hi{width:52px;height:52px;border-radius:50%;background:rgba(191,90,242,.22);display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.ht{flex:1;min-width:180px}.ht b{font-size:1.2rem}.ht p{color:var(--muted);font-size:.85rem;margin-top:2px}
.pillobj{border:1px solid rgba(191,90,242,.5);background:rgba(191,90,242,.15);color:#d7a8ff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:.8rem;white-space:nowrap}
body.light .pillobj{color:#7d2bb8}
.stats4{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:22px}
.tile{display:flex;align-items:center;gap:12px;padding:14px;border-radius:22px;background:var(--card);border:1px solid var(--border);box-shadow:var(--shine)}
.tile i,.sc i{font-style:normal;width:44px;height:44px;border-radius:50%;background:color-mix(in srgb,var(--c) 30%,transparent);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.tile>div{min-width:0;flex:1}.tile b{font-size:1.25rem;font-weight:800;display:block;font-variant-numeric:tabular-nums}.tile span{color:var(--muted);font-size:.74rem}
.tile .xpbar{margin:4px 0 0}
.secthead{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px}
.secthead h2{font-size:1.15rem;font-weight:800;letter-spacing:-.02em}.secthead a{color:var(--accent);font-weight:700;font-size:.85rem;cursor:pointer}
.subjgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:22px}
.sc{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:24px;cursor:pointer;background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);box-shadow:var(--shine);position:relative;transition:.2s}
.sc:active{transform:scale(.97)}
.sc i{border-radius:15px;background:var(--c);width:48px;height:48px}
.sc b{display:block;font-size:1rem}.sc span{display:block;color:var(--muted);font-size:.7rem;margin:2px 0 4px}.sc small{color:var(--c);font-weight:700;font-size:.72rem}
.sc em{position:absolute;right:14px;top:14px;font-style:normal;font-size:1.5rem;color:var(--c)}
.subjgrid>.sc:last-child:nth-child(odd){grid-column:1/-1}
.subjhdr[style*="--c"]{border-color:color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 14%,transparent)}
.skillrow{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:22px;scrollbar-width:none}
.sk{flex:0 0 84px;text-align:center;padding:12px 4px;border-radius:20px;background:var(--card);border:1px solid var(--border);box-shadow:var(--shine);cursor:pointer;font-size:.7rem;font-weight:700}
.sk i{display:block;font-style:normal;font-size:1.5rem;margin-bottom:4px}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:22px}
.quick button{display:flex;align-items:center;gap:10px;padding:14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--txt);font-size:.85rem;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:var(--shine)}
.trow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:.15s}
.trow:last-child{border-bottom:none}
.trow:active{background:var(--bg2)}
.trow.cur{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.trow.tdone{opacity:.55}
.trow .tt{width:52px;flex-shrink:0;font-size:.72rem;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.trow.cur .tt{color:var(--accent)}
.trow .ti{font-size:1.1rem;flex-shrink:0}
.trow .tn{flex:1;min-width:0;font-size:.86rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow.tdone .tn{text-decoration:line-through;color:var(--muted)}
.trow .txp{font-size:.72rem;font-weight:800;color:var(--green);flex-shrink:0}
.trow .tcheck{width:22px;height:22px;border-radius:50%;background:var(--green);color:#03210b;display:flex;align-items:center;justify-content:center;font-size:.72rem;flex-shrink:0}
.trow .tarrow{color:var(--muted);font-size:1.1rem;flex-shrink:0}
.subnav{display:flex;gap:4px;overflow-x:auto;padding:4px;margin-bottom:18px;background:var(--bg2);border:1px solid var(--border);border-radius:999px;scrollbar-width:none}
.sn{flex:1;white-space:nowrap;border:none;background:transparent;color:var(--muted);font-weight:700;font-size:.8rem;font-family:inherit;padding:8px 14px;border-radius:999px;cursor:pointer}
.sn.on{background:var(--card2);color:var(--txt);box-shadow:var(--shine)}
@media(min-width:700px){.stats4{grid-template-columns:repeat(4,1fr)}.subjgrid{grid-template-columns:repeat(3,1fr)}.quick{grid-template-columns:repeat(4,1fr)}}
@media(min-width:861px){.subnav{display:none}}
</style>
</head>

  <nav class="sidebar" id="sidebar"></nav>

</div>

<script>

  document.getElementById("sidebar").innerHTML='<div class="logo">Terminal+</div>'+VIEWS.map(v=>`<button class="navbtn" data-v="${v[0]}" onclick="go('${v[0]}')"><span class="ico">${v[1]}</span>${v[2]}</button>`).join("");
  document.getElementById("bottomnav").innerHTML='<div class="row">'+BN.map(b=>`<button class="bnavbtn" data-g="${b[0]}" onclick="go('${b[1]}')">${b[3]}${b[2]}</button>`).join("")+'</div>';
}
function go(v,arg){CUR=v;CURPROG=arg||CURPROG;clearInterval(TIMERP);TIMERP=null;
  document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.v===v));document.querySelectorAll(".bnavbtn").forEach(b=>b.classList.toggle("active",b.dataset.g===(GROUP[v]||v)));
  render();window.scrollTo(0,0)}
function render(){const m=document.getElementById("main");
  ({dash:renderDash,planning:renderPlanning,etudes:renderEtudes,competences:renderCompetences,apps:renderApps,
    ressources:renderRessources,habits:renderHabits,journal:renderJournal,progression:renderProgression,params:renderParams,fiches:renderFiches})[CUR](m);if(GROUP[CUR])m.insertAdjacentHTML("afterbegin",subnav())}
function renderDash(m){

  let cur=null,nxt=null;
  for(const s of slots){if(nm>=toMin(s[0])&&nm<toMin(s[1]))cur=s;if(!cur&&!nxt&&toMin(s[0])>nm)nxt=s}
  const lvl=levelOf(S.xp),base=LEVELS[lvl-1],nx=nextLevelXp(S.xp);
  const pct=Math.min(100,Math.round((S.xp-base)/(nx-base)*100));
  m.innerHTML=`<div class="brand">${LOGO}<div><div class="bt">Terminal<span>+</span></div><div class="bs">Ton avenir se prépare maintenant</div></div><div class="lvbadge">Niv. ${lvl}</div></div>
  <div class="hello card"><div class="hi">${cur?PROGRAMS[cur[2]].ico:"🎯"}</div><div class="ht"><b>Bonjour Mleck !</b><p>${cur?`En cours : ${PROGRAMS[cur[2]].n} · ${cur[0]}–${cur[1]}`:(nxt?`Prochaine : ${PROGRAMS[nxt[2]].ico} ${PROGRAMS[nxt[2]].n} à ${nxt[0]}`:coachMsg("hello"))}</p>
    ${cur?`<button class="btn primary" style="margin-top:10px" onclick="go('planning','${cur[2]}')">▶ Commencer · +${PROGRAMS[cur[2]].xp} XP</button>`
      :nxt?`<button class="btn" style="margin-top:10px" onclick="go('planning','${nxt[2]}')">Voir la prochaine séance →</button>`:""}
    </div><span class="pillobj">🔥 Objectif : Réussir ton bac</span></div>
  <div class="stats4">
    <div class="tile"><i style="--c:#30d158">✅</i><div><b>${slots.filter(x=>S.done[`${dn}|${x[0]}|${x[2]}`]).length}/${slots.length}</b><span>Séances du jour</span></div></div>
    <div class="tile"><i style="--c:#0a84ff">📖</i><div><b>${(S.studyMin/60).toFixed(1)}h</b><span>Temps d'étude</span></div></div>
    <div class="tile"><i style="--c:#ffd60a">⭐</i><div><b>${streakCalc()}</b><span>Jours consécutifs</span></div></div>
    <div class="tile"><i style="--c:#bf5af2">📈</i><div><span>Progression · ${S.xp} XP</span><b>${pct}%</b><div class="xpbar"><div style="width:${pct}%"></div></div></div></div>
  </div>
  <div class="secthead"><h2>📚 Mes matières</h2><a onclick="go('etudes')">Voir tout →</a></div>
  <div class="subjgrid">${SUBJECTS.map(sj=>{const d=S.subjects[sj]||{chaps:[]};const t=d.chaps.length,ok=d.chaps.filter(c=>c.s==="maitrise").length;
    return `<div class="sc" style="--c:${SM[sj][1]}" onclick="openSubj('${sj}')"><em>›</em><i>${SM[sj][0]}</i><div><b>${sj}</b><span>Cours • Exercices • Révisions</span><small>${ok}/${t} maîtrisés</small></div></div>`}).join("")}</div>
  <div class="secthead"><h2>🎯 Mes compétences</h2><a onclick="go('competences')">Voir tout →</a></div>
  <div class="skillrow">${SK.filter(k=>PROGRAMS[k[0]]).map(k=>`<div class="sk" onclick="go('planning','${k[0]}')"><i>${PROGRAMS[k[0]].ico}</i>${k[1]}</div>`).join("")}</div>
  <div class="secthead"><h2>⚡ Outils rapides</h2></div>
  <div class="quick"><button onclick="go('planning')">🗓️ Planning</button><button onclick="go('habits')">✅ Habitudes</button><button onclick="go('journal')">📓 Journal</button><button onclick="document.getElementById('dashTimer').scrollIntoView({behavior:'smooth',block:'center'})">⏱️ Concentration</button></div>
  <div class="secthead"><h2>📋 Programme du jour</h2><a onclick="go('planning')">Tout voir →</a></div>
  <div class="card timeline" style="padding:6px 0;margin-bottom:14px">
    ${slots.length?slots.map((sl,i)=>{const pp=PROGRAMS[sl[2]];const dn2=S.done[`${dn}|${sl[0]}|${sl[2]}`];const cr=nm>=toMin(sl[0])&&nm<toMin(sl[1]);
      return `<div class="trow ${cr?"cur":""} ${dn2?"tdone":""}" onclick="go('planning','${sl[2]}')">
        <span class="tt">${sl[0]}</span><span class="ti">${pp.ico}</span>
        <span class="tn">${pp.n}</span>
        ${dn2?'<span class="tcheck">✓</span>':`<span class="txp">+${pp.xp}</span>`}
        <span class="tarrow">›</span></div>`}).join(""):"<p style='padding:14px;color:var(--muted)'>Rien de prévu.</p>"}
  </div>
  ${timerHTML(cur?cur[2]:null)}
  <div class="card" style="margin-top:14px"><h3><span class="dot" style="background:var(--green)"></span>Rappels du jour</h3>
    ${RAPPELS.slice(0,8).map((r,i)=>S.reminders[i]?`<div class="lrow"><span>🕐 <b>${r[0]}</b> — ${r[1]}</span></div>`:"").join("")||"<p style='color:var(--muted)'>Tous désactivés.</p>"}</div>`;
}
let TDUR=25*60,TREM=25*60,TINT=null,TRUN=false,TPROG=null;
function timerHTML(prog){const dur=TDUR,rem=TREM,ratio=Math.min(1,Math.max(0,1-rem/Math.max(1,dur)));
  const mm=String(Math.floor(rem/60)).padStart(2,"0"),ss=String(rem%60).padStart(2,"0");
  const canResume=!TRUN&&TREM>0&&TREM<TDUR;
  const startBtn=TRUN?`<button class="btn" onclick="pauseTimer()">⏸ Pause</button>`
    :canResume?`<button class="btn primary" onclick="resumeTimer()">▶ Reprendre</button>`
    :`<button class="btn primary" onclick="startTimer(25,${prog?`'${prog}'`:"null"})">▶ Démarrer</button>`;
  return `<div class="card"><h3><span class="dot" style="background:var(--gold)"></span>⏱️ Mode concentration</h3>
    <p style="text-align:center;color:var(--muted);font-size:.78rem;margin:-4px 0 8px">${prog?PROGRAMS[prog].n:"Session libre"}</p>
    <div class="timerbig" id="dashTimer">${mm}:${ss}</div>
    <div class="xpbar" style="max-width:280px;margin:0 auto 14px"><div id="timerBarFill" style="width:${Math.round(ratio*100)}%"></div></div>
    <div class="segdisp">${[25,45,60].map(p=>`<button class="seg ${dur===p*60?"on":""}" onclick="startTimer(${p},${prog?`'${prog}'`:"null"})">${p} min</button>`).join("")}</div>
    <div style="display:flex;gap:8px;justify-content:center;align-items:center;margin-top:10px">
      <input type="number" id="customMin" min="1" max="240" placeholder="Durée perso (min)" style="max-width:170px;text-align:center">
      <button class="btn small" onclick="const v=parseInt(document.getElementById('customMin').value);if(v>0)startTimer(v,${prog?`'${prog}'`:"null"});else toast('Entre un nombre de minutes')">Démarrer</button>
    </div>
    <div class="timerbtns" style="margin-top:10px">${startBtn}<button class="btn ghost" onclick="resetTimer(${prog?`'${prog}'`:"null"})">↺ Réinit.</button></div>
  </div>`}
function startTimer(min,prog){TDUR=min*60;TREM=TDUR;TPROG=prog||null;TRUN=true;clearInterval(TINT);
  TINT=setInterval(tickTimer,1000);render()}
function pauseTimer(){TRUN=false;clearInterval(TINT);render()}
function resumeTimer(){if(TREM<=0)return;TRUN=true;clearInterval(TINT);TINT=setInterval(tickTimer,1000);render()}
function resetTimer(prog){clearInterval(TINT);TRUN=false;TDUR=25*60;TREM=25*60;TPROG=prog||null;render()}
function tickTimer(){TREM--;if(TREM<=0){clearInterval(TINT);TRUN=false;finishTimerSession();return}drawTimerLive()}
function drawTimerLive(){const el=document.getElementById("dashTimer");if(!el)return;
  el.textContent=String(Math.floor(TREM/60)).padStart(2,"0")+":"+String(TREM%60).padStart(2,"0");
  const bar=document.getElementById("timerBarFill");if(bar)bar.style.width=Math.round((1-TREM/Math.max(1,TDUR))*100)+"%"}
function finishTimerSession(){
  if(TPROG&&PROGRAMS[TPROG]){completeProg(TPROG)}
  else{addXP(25,"Session de concentration");modal(`<div class="big">🎉</div><h2>Session terminée !</h2><p style="font-size:2rem;font-weight:800;color:var(--green);margin:8px 0">+25 XP</p><p style="color:var(--muted);margin-bottom:16px">Total : <b>${S.xp} XP</b> — Niveau ${levelOf(S.xp)}</p><button class="btn green" onclick="closeModal()">Continuer</button>`)}
  TDUR=25*60;TREM=25*60;TPROG=null;render()}
let EDITPLAN=false;
function delSlot(d,t,k){S.schedule[d]=S.schedule[d].filter(s=>!(s[0]===t&&s[2]===k));save();render()}
function addSlot(d){const a=document.getElementById("na-"+d).value,b=document.getElementById("nb-"+d).value,p=document.getElementById("np-"+d).value;
  if(!a||!b){toast("Renseigne l'heure de début et de fin");return}
  S.schedule[d].push([a,b,p]);S.schedule[d].sort((x,y)=>x[0].localeCompare(y[0]));save();render()}
function renderPlanning(m){
  if(CURPROG&&PROGRAMS[CURPROG]){renderProgram(m,CURPROG);return}
  const dn=dayName();
  m.innerHTML=`<h1>Planning hebdomadaire</h1><p class="sub">Touche une séance pour voir ses ressources. ${EDITPLAN?"Mode édition actif — supprime ou ajoute des créneaux.":""}</p>
  <button class="btn ${EDITPLAN?"primary":""}" style="margin-bottom:14px" onclick="EDITPLAN=!EDITPLAN;render()">${EDITPLAN?"✓ Terminer l'édition":"✎ Modifier le planning"}</button>
  <div class="days">${Object.keys(S.schedule).map(d=>`
    <div class="daycol ${d===dn?"today":""}"><h4>${d}${d===dn?" ●":""}</h4>
      ${S.schedule[d].map(s=>{const p=PROGRAMS[s[2]];const done=S.done[`${d}|${s[0]}|${s[2]}`];
        return `<div class="slot ${done?"done":""}" onclick="${EDITPLAN?"":`openProg('${s[2]}')`}">
          <div class="t">${s[0]} – ${s[1]}</div><div class="n">${p.ico} ${p.n}</div>
          <span class="badge">${p.cat}</span> <span class="badge" style="color:var(--green)">+${p.xp} XP</span>
          ${EDITPLAN?`<button class="btn ghost small" style="margin-top:6px;color:var(--red)" onclick="event.stopPropagation();delSlot('${d}','${s[0]}','${s[2]}')">🗑 Retirer</button>`:""}</div>`}).join("")}
      ${EDITPLAN?`<div class="slot" style="cursor:default">
        <input type="text" id="na-${d}" placeholder="Début (ex 18h00)" style="margin-bottom:6px">
        <input type="text" id="nb-${d}" placeholder="Fin (ex 18h30)" style="margin-bottom:6px">
        <select id="np-${d}" style="margin-bottom:6px">${Object.keys(PROGRAMS).map(k=>`<option value="${k}">${PROGRAMS[k].ico} ${PROGRAMS[k].n}</option>`).join("")}</select>
        <button class="btn small primary" onclick="addSlot('${d}')">+ Ajouter</button></div>`:""}
    </div>`).join("")}</div>`;
}
function openProg(k){CURPROG=k;render()}
function renderProgram(m,k){const p=PROGRAMS[k];
  const vids=(VIDEOS[{logique:"logique",strategie:"strategie",informatique:"info",maths:"maths",revisions:"maths",pensee:"critique",lecture:"lecture",business:"business",anglais:"anglais",combat:"combat",psychologie:"psychologie",piano:"piano"}[k]]||[]);
  const tips=CONSEILS[p.tips]||[];
  m.innerHTML=`<button class="btn ghost small" onclick="CURPROG=null;render()">← Retour au planning</button>
  <div class="pdhead" style="margin-top:12px"><div class="pdicon">${p.ico}</div>
    <div><h1 style="margin:0">${p.n}</h1><p class="sub" style="margin:2px 0 0">${p.cat}</p></div></div>
  <div class="chips"><span class="chip xp">+${p.xp} XP à la validation</span><span class="chip">Minuteur inclus</span><span class="chip">Ressources liées</span></div>
  <div class="card" style="margin-bottom:14px"><h3><span class="dot" style="background:var(--red)"></span>⏰ Alarme & 🔔 notification</h3>
    <p style="color:var(--muted);font-size:.8rem;margin-bottom:10px">Réveil et coucher ont déjà une vraie alarme sur ton téléphone. Pour ce programme, demande-moi dans le chat "crée une alarme pour ${p.n}" et je le fais réellement — ou reçois un rappel local pendant que l'app reste ouverte :</p>
    <button class="btn small" onclick="notifyIn10('${p.n.replace(/'/g,"")}')">🔔 Me notifier dans 10 min</button></div>
  ${timerHTML(k)}
  <div class="grid g2">
    <div class="card"><h3><span class="dot"></span>Applications recommandées</h3>
      ${p.apps.length?p.apps.map(a=>{const A=APPS[a];return `<div class="resrow"><div class="ric">${A.ico}</div><div class="rt"><b>${A.n}</b><p>${A.d}</p></div><a href="${A.l}" target="_blank">Ouvrir ↗</a></div>`}).join(""):"<p style='color:var(--muted);font-size:.85rem'>Aucune application nécessaire pour cette séance.</p>"}
      ${vids.length?`<h3 style="margin-top:16px"><span class="dot" style="background:var(--red)"></span>Vidéos & liens YouTube</h3>`+vids.map(v=>`<div class="resrow"><div class="ric">▶️</div><div class="rt"><b>${v[0]}</b><p>${v[1]}</p></div><a href="${v[2]}" target="_blank">Regarder ↗</a></div>`).join(""):""}
    </div>
    ${(METHODE[k]||LIVRES[k])?`<div class="card">
    ${METHODE[k]?`<h3><span class="dot" style="background:var(--green)"></span>Ce que tu dois réellement faire</h3><div class="tip">🎯 ${METHODE[k]}</div>`:""}
    ${LIVRES[k]?`<h3 style="margin-top:${METHODE[k]?'16px':'0'}"><span class="dot" style="background:var(--accent2)"></span>Livres à lire</h3>${LIVRES[k].map(l=>`<div class="tip">📚 ${l}</div>`).join("")}`:""}
  </div>`:""}
  <div class="card"><h3><span class="dot" style="background:var(--gold)"></span>Conseils</h3>
      ${tips.map(t=>`<div class="tip">💡 ${t}</div>`).join("")}
      ${p.hab.length?`<h3 style="margin-top:16px"><span class="dot" style="background:var(--green)"></span>Habitudes liées</h3>`+p.hab.map(h=>`<div class="lrow" onclick="go('habits')" style="cursor:pointer"><span>✅ ${HABITS[h]}</span><span style="color:var(--accent);font-size:.75rem">Ouvrir →</span></div>`).join(""):""}
      <h3 style="margin-top:16px"><span class="dot" style="background:var(--accent2)"></span>Séance</h3>
      <div class="timerbig" id="dashTimer">25:00</div>
      <div class="timerbtns">
        <button class="btn ghost" onclick="startTimer(25)">25</button><button class="btn ghost" onclick="startTimer(45)">45</button><button class="btn ghost" onclick="startTimer(60)">60</button>
        <button class="btn primary" onclick="startTimer(25)">▶ Démarrer</button>
        <button class="btn ghost" onclick="stopTimer()">⏸ Pause</button>
      </div>
      <button class="btn green" style="width:100%;justify-content:center;margin-top:12px;padding:13px" onclick="completeProg('${k}')">✔ Terminer la séance — valider +${p.xp} XP</button>
    </div>

function completeProg(k){const p=PROGRAMS[k];
  addXP(p.xp,p.n);
  const dn=dayName();const slot=(S.schedule[dn]||[]).find(s=>s[2]===k);if(slot)S.done[`${dn}|${slot[0]}|${k}`]=true;
  S.studyMin+=25;save();
  modal(`<div class="big">${p.ico}</div><h2>Séance terminée !</h2>
    <p style="font-size:2rem;font-weight:800;color:var(--green);margin:8px 0">+${p.xp} XP</p>
    <p style="color:var(--muted);margin-bottom:16px">${p.n} validée. Total : <b>${S.xp} XP</b> — Niveau ${levelOf(S.xp)}</p>
    <button class="btn primary" onclick="closeModal();go('dash')">Continuer</button>`)}
function renderEtudes(m){

        <select onchange="setChap('${subj}',${i},this.value)" style="width:auto;padding:5px 8px;font-size:.78rem">
          <option value="aprendre" ${c.s==="aprendre"?"selected":""}>À apprendre</option>

        <button class="btn ghost small" onclick="delChap('${subj}',${i})">✕</button></div>`).join("")||"<p style='color:var(--muted);font-size:.8rem;padding:4px'>Aucun chapitre.</p>"}

    </div></div>`}).join("")}</div>
  <div class="card" style="align-self:start"><h3><span class="dot"></span>Méthode de révision</h3>
    <div class="tip">📖 Active recall : ferme le cahier et restitue de mémoire.</div>

    <div class="tip">⚠️ Transforme chaque erreur en carte Anki.</div>
    <div class="tip">🎯 1 exercice difficile vaut 5 exercices faciles.</div></div></div>`;
}
function subKey(s){return s.replace(/\W/g,"")}
function addChap(subj){const el=document.getElementById("chap-"+subKey(subj));if(!el.value.trim())return;
  S.subjects[subj]=S.subjects[subj]||{chaps:[],notes:[]};S.subjects[subj].chaps.push({n:el.value.trim(),s:"aprendre"});save();render()}
function setChap(subj,i,v){S.subjects[subj].chaps[i].s=v;save();render()}
function delChap(subj,i){S.subjects[subj].chaps.splice(i,1);save();render()}
function addNote(subj){const el=document.getElementById("err-"+subKey(subj));if(!el.value.trim())return;
  S.subjects[subj]=S.subjects[subj]||{chaps:[],notes:[]};S.subjects[subj].notes.push(el.value.trim());save();render()}
function delNote(subj,i){S.subjects[subj].notes.splice(i,1);save();render()}

function renderRessources(m){
  const LIVRES=[["Atomic Habits — James Clear","Habitudes","Le manuel de référence pour construire des habitudes durables.","https://jamesclear.com/atomic-habits"],
    ["Thinking, Fast and Slow — Daniel Kahneman","Pensée critique","Comprendre les biais de ton cerveau.","https://us.macmillan.com/books/9780374533557"],
    ["The 7 Habits of Highly Effective People — S. Covey","Efficacité personnelle","Les 7 habitudes des gens efficaces.","https://www.franklincovey.com/the-7-habits/"]];
  m.innerHTML=`<h1>Ressources</h1><p class="sub">YouTube, sites et livres organisés par compétence.</p>
  <div class="grid g2">
    <div class="card"><h3><span class="dot" style="background:var(--red)"></span>Vidéos YouTube</h3>
      ${Object.entries(VIDEOS).flatMap(([k,arr])=>arr.map(v=>`<div class="resrow"><div class="ric">▶️</div><div class="rt"><b>${v[0]}</b><p>${v[1]}</p></div><a href="${v[2]}" target="_blank">Regarder ↗</a></div>`)).join("")}</div>
    <div><div class="card" style="margin-bottom:14px"><h3><span class="dot"></span>Sites</h3>
      <div class="resrow"><div class="ric">♟️</div><div class="rt"><b>Lichess</b><p>Échecs gratuits illimités.</p></div><a href="https://lichess.org" target="_blank">Ouvrir ↗</a></div>
      <div class="resrow"><div class="ric">💻</div><div class="rt"><b>freeCodeCamp</b><p>Certifications gratuites.</p></div><a href="https://www.freecodecamp.org" target="_blank">Ouvrir ↗</a></div>
      <div class="resrow"><div class="ric">📐</div><div class="rt"><b>Khan Academy</b><p>Maths & sciences.</p></div><a href="https://fr.khanacademy.org" target="_blank">Ouvrir ↗</a></div></div>
    <div class="card"><h3><span class="dot" style="background:var(--gold)"></span>Livres</h3>
      ${LIVRES.map(l=>`<div class="resrow"><div class="ric">📕</div><div class="rt"><b>${l[0]}</b><p>${l[1]} — ${l[2]}</p></div><a href="${l[3]}" target="_blank">Voir ↗</a></div>`).join("")}</div></div>
  </div>`;
}
function renderHabits(m){
  const tk=todayKey(),today=S.habits[tk]||{};
  const keys=Object.keys(HABITS),done=keys.filter(k=>today[k]).length;
  let streak=0,d=new Date();
  while(true){const kk=d.toISOString().slice(0,10);const hh=S.habits[kk]||{};
    if(keys.every(k=>hh[k])){streak++;d.setDate(d.getDate()-1)}else break}
  m.innerHTML=`<h1>Habitudes</h1><p class="sub">Coche chaque jour. La série parfaite fait monter ta régularité.</p>
  <div class="grid g4" style="margin-bottom:16px">
    <div class="card"><div class="stat" style="color:var(--green)">${done}/${keys.length}</div><div class="statlbl">Aujourd'hui</div></div>
    <div class="card"><div class="stat">🔥 ${streak}</div><div class="statlbl">Série parfaite (jours)</div></div>
    <div class="card"><div class="stat">${Math.round(done/keys.length*100)}%</div><div class="statlbl">Taux du jour</div></div>
    <div class="card"><div class="stat" style="color:var(--gold)">🏆 ${S.bestStreak||0}</div><div class="statlbl">Meilleure série</div></div></div>
  <div class="card">${keys.map(k=>`<div class="habit ${today[k]?"done":""}">
    <div class="cb ${today[k]?"on":""}" onclick="toggleHabit('${k}')">✔</div><b>${HABITS[k]}</b>
    <span class="meta">${today[k]?"Validé ✓":"À faire"}</span></div>`).join("")}</div>`;
}
function toggleHabit(k){const tk=todayKey();S.habits[tk]=S.habits[tk]||{};
  S.habits[tk][k]=!S.habits[tk][k];
  if(S.habits[tk][k])addXP(5,"Habitude : "+HABITS[k],true);
  if(Object.keys(HABITS).every(h=>S.habits[tk][h])){S.bestStreak=Math.max(S.bestStreak||0,streakCalc());toast("🏆 Journée parfaite ! Toutes les habitudes validées.")}
  save();render()}
function streakCalc(){let s=0,d=new Date();const keys=Object.keys(HABITS);
  while(true){const hh=S.habits[d.toISOString().slice(0,10)]||{};
    if(keys.every(k=>hh[k])){s++;d.setDate(d.getDate()-1)}else break}return s}
const JQ=["Qu'ai-je appris aujourd'hui ?","Quelle erreur ai-je faite ?","Comment la corriger ?","Qu'est-ce qui m'a déconcentré ?","Quelle est ma priorité pour demain ?"];
function renderJournal(m){
  const tk=todayKey(),e=S.journal[tk]||{};
  m.innerHTML=`<h1>Journal du soir</h1><p class="sub">5 questions. 5 minutes. Chaque soir après 21h.</p>
  <div class="grid g2"><div class="card">
    ${JQ.map((q,i)=>`<div class="jq">${i+1}. ${q}</div><textarea id="j${i}" placeholder="Ta réponse…">${esc(e[i]||"")}</textarea>`).join("")}
    <button class="btn green" style="margin-top:14px;width:100%;justify-content:center" onclick="saveJournal()">💾 Enregistrer le journal (+10 XP)</button></div>
  <div class="card" style="align-self:start"><h3><span class="dot"></span>Historique</h3>
    ${Object.keys(S.journal).sort().reverse().slice(0,10).map(d=>`<div class="lrow" style="cursor:pointer" onclick="viewJournal('${d}')"><span>📓 ${d}</span><span style="color:var(--accent)">Lire →</span></div>`).join("")||"<p style='color:var(--muted)'>Aucune entrée pour l'instant.</p>"}</div></div>`;
}
function saveJournal(){const tk=todayKey();const was=S.journal[tk];S.journal[tk]=JQ.map((_,i)=>document.getElementById("j"+i).value);
  if(!was)addXP(10,"Journal du soir",true);else save();
  toast("📓 Journal enregistré !");render()}
function viewJournal(d){const e=S.journal[d];modal(`<h2 style="margin-bottom:10px">📓 ${d}</h2>${JQ.map((q,i)=>`<div class="jq" style="text-align:left">${i+1}. ${q}</div><p style="text-align:left;font-size:.85rem;color:var(--muted);margin-bottom:8px">${esc(e[i]||"—")||"—"}</p>`).join("")}<button class="btn primary" onclick="closeModal()" style="margin-top:10px">Fermer</button>`)}
function coachMsg(k){const soft={hello:"Continue sur ta lancée, chaque petit effort compte.",done:"⚡ +${x} XP — ${label}"};
  const hard={hello:"Personne ne fera le travail à ta place. Bouge.",done:"Fait. C'est le minimum attendu. Suivant."};
  return (S.rigueur?hard:soft)[k]}
function addXP(x,label,silent){S.xp+=x;S.hist.push({d:todayKey(),x,label});
  if(!silent)toast(S.rigueur?coachMsg("done"):`⚡ +${x} XP — ${label}`);save()}
let CARDSHOW=null;
function addCard(){const subj=document.getElementById("cardSubj").value,f=document.getElementById("cardFront").value.trim(),b=document.getElementById("cardBack").value.trim();
  if(!f||!b){toast("Recto et verso obligatoires");return}
  S.cards.push({id:"c"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),subj,front:f,back:b,due:Date.now(),ivl:0});
  save();render()}
function delCard(id){S.cards=S.cards.filter(c=>c.id!==id);save();render()}
function gradeCard(id,g){const c=S.cards.find(x=>x.id===id);if(!c)return;const now=Date.now();
  if(g==="again"){c.ivl=0;c.due=now+10*60000}
  else{c.ivl=c.ivl===0?1:g==="hard"?Math.max(1,Math.round(c.ivl*1.2)):g==="good"?Math.round(c.ivl*2):Math.round(c.ivl*3);
    c.due=now+c.ivl*86400000;S.xp+=5;S.hist.push({d:todayKey(),x:5,label:"Fiche revue"})}
  CARDSHOW=null;save();render()}
function renderFiches(m){
  const due=S.cards.filter(c=>c.due<=Date.now());
  m.innerHTML=`<h1>🧠 Fiches (répétition espacée)</h1><p class="sub">Comme Anki, directement dans l'app. Crée une fiche, révise-la quand elle est due — l'intervalle s'allonge si tu la connais bien.</p>
  <div class="card" style="margin-bottom:16px"><h3>➕ Nouvelle fiche</h3>
    <select id="cardSubj" style="margin-bottom:8px">${SUBJECTS.map(s=>`<option>${s}</option>`).join("")}<option>Général</option></select>
    <textarea id="cardFront" placeholder="Recto — la question"></textarea><div style="height:8px"></div>
    <textarea id="cardBack" placeholder="Verso — la réponse"></textarea><div style="height:10px"></div>
    <button class="btn primary" onclick="addCard()">Ajouter la fiche</button></div>
  <div class="card" style="margin-bottom:16px"><h3><span class="dot" style="background:var(--green)"></span>À réviser maintenant (${due.length})</h3>
    ${due.length?due.map(c=>`<div class="slot" style="cursor:default;margin-bottom:10px">
      <div class="n">${c.subj} · ${c.front}</div>
      ${CARDSHOW===c.id?`<div style="margin:8px 0;color:var(--muted)">${c.back}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn small" style="background:var(--red);color:#fff" onclick="gradeCard('${c.id}','again')">Encore</button>
          <button class="btn small" onclick="gradeCard('${c.id}','hard')">Difficile</button>
          <button class="btn small" onclick="gradeCard('${c.id}','good')">Correct</button>
          <button class="btn small green" onclick="gradeCard('${c.id}','easy')">Facile</button>
        </div>`:`<button class="btn small" onclick="CARDSHOW='${c.id}';render()">Voir la réponse</button>`}
      </div>`).join(""):"<p style='color:var(--muted)'>Rien à réviser pour l'instant 👌</p>"}</div>
  <div class="card"><h3>📚 Toutes les fiches (${S.cards.length})</h3>
    ${S.cards.length?S.cards.map(c=>`<div class="lrow"><span>${c.subj} · ${c.front}</span><button class="btn ghost small" onclick="delCard('${c.id}')">🗑</button></div>`).join(""):"<p style='color:var(--muted)'>Aucune fiche créée.</p>"}</div>`;
}
function renderProgression(m){
  const lvl=levelOf(S.xp),base=LEVELS[lvl-1],nx=nextLevelXp(S.xp);
  const pct=Math.min(100,Math.round((S.xp-base)/(nx-base)*100));
  const month=todayKey().slice(0,7)+"-01";
  m.innerHTML=`<h1>Progression & XP</h1><p class="sub">Niveau ${lvl} · ${S.xp} XP au total</p>
  <div class="grid g4">
    <div class="card"><div class="stat" style="color:var(--accent)">${xpSince(todayKey())}</div><div class="statlbl">XP aujourd'hui</div></div>
    <div class="card"><div class="stat" style="color:var(--accent)">${xpSince(weekKey())}</div><div class="statlbl">XP cette semaine</div></div>
    <div class="card"><div class="stat" style="color:var(--accent)">${xpSince(month)}</div><div class="statlbl">XP ce mois</div></div>
    <div class="card"><div class="stat" style="color:var(--gold)">Niv. ${lvl}</div><div class="statlbl">Niveau actuel</div></div></div>
  <div class="card" style="margin:14px 0"><h3><span class="dot" style="background:var(--gold)"></span>Progression vers le niveau ${lvl+1} (${nx} XP)</h3>
    <div class="xpbar" style="height:16px"><div style="width:${pct}%"></div></div>
    <p style="color:var(--muted);font-size:.83rem">${S.xp-base} / ${nx-base} XP — encore ${nx-S.xp} XP pour monter de niveau.</p></div>
  <div class="grid g2"><div class="card"><h3><span class="dot"></span>Grille des niveaux</h3>
    ${LEVELS.map((x,i)=>`<div class="lrow"><span>Niveau ${i+1}</span><b style="color:${S.xp>=x?"var(--green)":"var(--muted)"}">${S.xp>=x?"✔":""} ${x} XP</b></div>`).join("")}</div>
  <div class="card"><h3><span class="dot" style="background:var(--green)"></span>Historique XP</h3>
    ${S.hist.slice(-25).reverse().map(h=>`<div class="lrow"><span>${h.d} — ${esc(h.label)}</span><b style="color:var(--green)">+${h.x}</b></div>`).join("")||"<p style='color:var(--muted)'>Encore aucun XP — commence une séance !</p>"}</div></div>`;
}
function renderParams(m){
  m.innerHTML=`<h1>Paramètres</h1><p class="sub">Rappels visuels, apparence et données.</p>
  <div class="grid g2"><div class="card"><h3><span class="dot"></span>Rappels</h3>
    ${RAPPELS.map((r,i)=>`<div class="lrow"><span>🕐 <b>${r[0]}</b> — ${r[1]}</span><div class="switch ${S.reminders[i]?"on":""}" onclick="S.reminders[${i}]=!S.reminders[${i}];save();render()"></div></div>`).join("")}
    <p style="color:var(--muted);font-size:.75rem;margin-top:8px">Rappels visuels (notifications natives prévues en V2).</p></div>
  <div class="card"><h3><span class="dot" style="background:var(--accent2)"></span>Apparence & données</h3>
    <div class="lrow"><span>🌙 / ☀️ Mode sombre / clair</span><div class="switch ${!S.light?"on":""}" onclick="S.light=!S.light;document.body.classList.toggle('light',S.light);save();render()"></div></div>
    <div class="lrow"><span>⚡ XP total</span><b>${S.xp} XP</b></div>
    <div class="lrow"><span>⏱ Temps d'étude</span><b>${S.studyMin} min</b></div>
    <button class="btn" style="margin-top:12px" onclick="S.studyMin+=30;save();render()">+30 min d'étude manuelles</button>
    <button class="btn ghost" style="margin-top:10px;color:var(--red)" onclick="if(confirm('Tout réinitialiser ? Cette action est définitive.')){localStorage.removeItem(KEY);location.reload()}">🗑 Réinitialiser toutes les données</button>
    <p style="color:var(--muted);font-size:.75rem;margin-top:12px">Données stockées localement sur cet appareil (localStorage).</p></div>
  <div class="card"><h3><span class="dot" style="background:var(--red)"></span>Mode Rigueur</h3>
    <div class="lrow"><span>🔥 Ton plus strict, zéro complaisance</span><div class="switch ${S.rigueur?"on":""}" onclick="S.rigueur=!S.rigueur;save();render()"></div></div>
    <p style="color:var(--muted);font-size:.75rem;margin-top:8px">Change le ton des messages (accueil, validation de séance). Aucune punition, juste plus direct.</p></div>
  <div class="card"><h3><span class="dot" style="background:var(--green)"></span>🔄 Synchronisation entre appareils (bêta)</h3>
    <p style="color:var(--muted);font-size:.8rem;margin-bottom:10px">Best-effort via un service externe gratuit — pas une sync instantanée, il faut appuyer sur Envoyer / Recevoir. Garde ton code quelque part.</p>
    <input type="text" id="syncCode" placeholder="Code de synchronisation" value="${S.syncId||""}" style="margin-bottom:8px">
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn small" onclick="syncCreate()">Créer un code ici</button>
      <button class="btn small primary" onclick="syncPush()">Envoyer mes données</button>
      <button class="btn small" onclick="syncPull()">Recevoir depuis ce code</button>
    </div></div></div>`;
}
async function syncCreate(){try{const r=await fetch("https://jsonblob.com/api/jsonBlob",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(S)});
  const loc=r.headers.get("Location")||r.headers.get("location");if(!loc){toast("Échec — réessaie plus tard");return}
  S.syncId=loc.split("/").pop();save();render();toast("Code créé : "+S.syncId)}catch(e){toast("Pas de connexion")}}
async function syncPush(){if(!S.syncId){toast("Crée d'abord un code");return}
  try{await fetch("https://jsonblob.com/api/jsonBlob/"+S.syncId,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(S)});toast("Envoyé ✓")}catch(e){toast("Échec de l'envoi")}}
async function syncPull(){const id=document.getElementById("syncCode").value.trim();if(!id){toast("Entre un code");return}
  try{const r=await fetch("https://jsonblob.com/api/jsonBlob/"+id);if(!r.ok){toast("Code introuvable");return}
    const data=await r.json();data.syncId=id;S=data;save();render();toast("Reçu ✓")}catch(e){toast("Échec de la réception")}}
buildNav();
if(S.light)document.body.classList.add("light");
const _q=new URLSearchParams(location.search).get("v");
if(_q&&VIEWS.some(v=>v[0]===_q)){go(_q)}
else if(_q==="timer"){go("dash");setTimeout(()=>{const t=document.getElementById("dashTimer");t&&t.scrollIntoView({block:"center"})},250)}
else go("dash");
</script><script>
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){window.addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js").catch(()=>{}))}
</script>
</body>
</html>
